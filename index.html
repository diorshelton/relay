<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Relay — Tic-Tac-Toe</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 3rem;
  }
  h1 {
    margin-bottom: 0.5rem;
  }
  #status {
    font-size: 1.25rem;
    margin-bottom: 1rem;
    min-height: 1.5rem;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 6rem);
    grid-template-rows: repeat(3, 6rem);
    gap: 0.5rem;
  }
  .cell {
    font-size: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    border: 1px solid #999;
    cursor: pointer;
  }
  .cell:hover {
    background: #e0e0e0;
  }
</style>
</head>
<body>

<h1>Relay</h1>
<div id="status"></div>
<div id="conn-status"></div>
<div id="board">
  <button class="cell" data-position="0"></button>
  <button class="cell" data-position="1"></button>
  <button class="cell" data-position="2"></button>
  <button class="cell" data-position="3"></button>
  <button class="cell" data-position="4"></button>
  <button class="cell" data-position="5"></button>
  <button class="cell" data-position="6"></button>
  <button class="cell" data-position="7"></button>
  <button class="cell" data-position="8"></button>
</div>

<script>

	/* WEB SOCKET CONNECTION*/
	let socket = new WebSocket("ws://"+ window.location.host + "/ws");
	
	const connStatusEl = document.getElementById('conn-status');

	socket.addEventListener("open", (event) => {
		document.getElementById("conn-status").style.color = "green"
		
		//Send test message
		socket.send(JSON.stringify({message: `Connected`}));

	});

	socket.addEventListener("message", (event) => {
		const data = JSON.parse(event.data);
		//Check if the server sent a connection count update
		if (data.type == "connection_update") {
			connStatusEl.innerText = `Connected! Total Connections = ${data.count}`;
		}
	});

	socket.onerror = (err) => {
		connStatusEl.innerText = "Connection failed"	
		connStatusEl.style.color = "red"	
	};


  const statusEl = document.getElementById('status');
  const cells = document.querySelectorAll('.cell');

  const RESULT_TEXT = {
    in_progress: null,
    x_wins: "X wins!",
    o_wins: "O wins!",
    draw: "Draw!",
  };

  function render(state) {
    state.board.forEach((mark, i) => {
      cells[i].textContent = mark;
    });
    statusEl.textContent = RESULT_TEXT[state.result] || `${state.turn}'s turn`;
  }

  function showError(message) {
    statusEl.textContent = message;
  }

  async function loadState() {
    const res = await fetch('/state');
    const data = await res.json();
    render(data);
  }

  async function makeMove(position) {
    const res = await fetch('/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ position }),
    });
    const data = await res.json();
    if (res.ok) {
      render(data);
    } else {
      showError(data.error);
    }
  }

  cells.forEach((cell) => {
    cell.addEventListener('click', () => {
      makeMove(Number(cell.dataset.position));
    });
  });

  loadState();
</script>

</body>
</html>
